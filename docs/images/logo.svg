<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#667eea" opacity="0.1" stroke="#667eea" stroke-width="2"/>

  <!-- Probability distribution curve (Bell curve) -->
  <g transform="translate(30, 40)">
    <!-- X-axis -->
    <line x1="0" y1="100" x2="140" y2="100" stroke="#333" stroke-width="1.5"/>
    <!-- Y-axis -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#333" stroke-width="1.5"/>

    <!-- Normal distribution bell curve -->
    <path d="M 5 95 Q 20 85, 35 70 Q 50 50, 70 35 Q 85 28, 100 25 Q 115 28, 130 35 Q 150 50, 165 70 Q 180 85, 195 95"
          stroke="#667eea" stroke-width="2.5" fill="none"/>

    <!-- Fill under curve -->
    <path d="M 5 95 Q 20 85, 35 70 Q 50 50, 70 35 Q 85 28, 100 25 Q 115 28, 130 35 Q 150 50, 165 70 Q 180 85, 195 95 L 195 100 Q 180 100, 165 100 Q 150 100, 130 100 Q 100 100, 70 100 Q 50 100, 35 100 Q 20 100, 5 100 Z"
          fill="#667eea" opacity="0.15"/>

    <!-- Confidence interval markers -->
    <line x1="55" y1="100" x2="55" y2="105" stroke="#764ba2" stroke-width="1.5"/>
    <line x1="145" y1="100" x2="145" y2="105" stroke="#764ba2" stroke-width="1.5"/>
    <text x="100" y="118" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#764ba2">95% CI</text>
  </g>

  <!-- Text label -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="bold"
        text-anchor="middle" fill="#667eea">PROBABILITY</text>
</svg>
